# MAPLE Configuration — Block Sorting Demo
# Uses ExampleVision (hardcoded detections) and a post-action hook.

experiment:
  name: Block Sorting Demo
  objective: Sort colored blocks into assigned goal zones by color
  constraints:
    - "Only pick one block at a time"
    - "Red blocks go to goal zone 1, blue blocks go to goal zone 2"

operator:
  # Vision view registry — each view is a named scene the LLM can observe via
  # detect(view=...) / verify(view=...). MAPLE captures frame(s) for the view
  # (running `capture` on the given node) and hands the raw datapoint values to
  # the view's VisionBackend. The LLM may also pass detect(node=...) and MAPLE
  # resolves it to the view whose `covers` includes that node (node wins if
  # both view and node are given).
  vision:
    views:
      block_table:
        backend: "vision:ExampleVision"
        capture:
          node: StubBot
          action: analyze            # stand-in "capture" for the demo stub node
        covers: [StubBot]
    default_view: block_table

  # Custom tools to register with the MCP server (module:function format)
  # These are loaded at startup and available to the LLM agent.
  custom_tools: []
  # custom_tools:
  #   - "my_tools:prepare_sample"
  #   - "my_tools:measure_volume"

  # After each robot action, call StubBot's analyze action for verification
  post_action_hooks:
    - node: StubBot
      action: analyze
      args:
        task_description: "Verify placement accuracy"
