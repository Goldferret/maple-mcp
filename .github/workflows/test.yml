name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'figures/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'figures/**'
      - 'LICENSE'

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m "not integration" --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      matrix:
        madsci-version: ["v0.5.0", "v0.7.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install matching MADSci client
        run: |
          VERSION=${{ matrix.madsci-version }}
          VERSION=${VERSION#v}
          pip install "madsci.client==${VERSION}" "madsci.common==${VERSION}" "madsci.experiment_application==${VERSION}" "madsci.node_module==${VERSION}"

      - name: Start MADSci services
        run: |
          sed -i "s|ghcr.io/ad-sdl/madsci:v0.5.0|ghcr.io/ad-sdl/madsci:${{ matrix.madsci-version }}|g" docker-compose.ci.yaml
          docker compose -f docker-compose.ci.yaml up -d

      - name: Wait for services to be ready
        run: |
          for mgr in "Event Manager:8001" "Workcell Manager:8005"; do
            name="${mgr%%:*}"; port="${mgr##*:}"
            echo "Waiting for $name on :$port ..."
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/health" >/dev/null 2>&1 || curl -sf "http://localhost:$port/" >/dev/null 2>&1; then
                echo "✓ $name ready"; break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$name not ready after 120s"
                docker compose -f docker-compose.ci.yaml logs --tail=50
                exit 1
              fi
              sleep 2
            done
          done
          echo "✓ MADSci ${{ matrix.madsci-version }} services ready"

      - name: Create .env for integration tests
        run: |
          printf 'WORKCELL_SERVER_URL=http://localhost:8005/\nEXPERIMENT_SERVER_URL=http://localhost:8002/\nEVENT_SERVER_URL=http://localhost:8001/\nDATA_SERVER_URL=http://localhost:8004/\nRESOURCE_SERVER_URL=http://localhost:8003/\nLOCATION_SERVER_URL=http://localhost:8006/\nMCP_OPERATOR_URL=http://localhost:8102/mcp\n' > examples/block_sorting/.env
          cp examples/block_sorting/.env .env

      - name: Run integration tests
        # --timeout: a hung test (e.g. await_workflow polling a dead node) fails
        # fast and named, instead of stalling CI indefinitely. TEMPORARY while we
        # diagnose the test_experiment_lifecycle hang — tune/remove after.
        run: pytest -m integration --tb=short --timeout=180 --timeout-method=thread

      - name: Tear down
        if: always()
        run: |
          maple down || true
          docker compose -f docker-compose.ci.yaml down -v
