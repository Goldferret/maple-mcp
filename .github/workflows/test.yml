name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m "not integration" --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start MADSci services
        run: |
          docker compose -f docker-compose.ci.yaml up -d
          echo "Waiting for services to be ready..."
          sleep 20

      - name: Verify services are up
        run: |
          curl -sf http://localhost:8001/health || (echo "Event Manager not ready" && exit 1)
          curl -sf http://localhost:8005/health || (echo "Workcell Manager not ready" && exit 1)
          echo "✓ MADSci services ready"

      - name: Start MAPLE demo stack
        run: |
          cd examples/block_sorting
          maple serve --stub
          sleep 5
          maple status
        env:
          WORKCELL_SERVER_URL: http://localhost:8005/
          EXPERIMENT_SERVER_URL: http://localhost:8002/
          EVENT_SERVER_URL: http://localhost:8001/
          DATA_SERVER_URL: http://localhost:8004/
          RESOURCE_SERVER_URL: http://localhost:8003/
          LOCATION_SERVER_URL: http://localhost:8006/

      - name: Run integration tests
        run: pytest -m integration --tb=short
        env:
          WORKCELL_SERVER_URL: http://localhost:8005/
          EXPERIMENT_SERVER_URL: http://localhost:8002/
          EVENT_SERVER_URL: http://localhost:8001/
          DATA_SERVER_URL: http://localhost:8004/
          RESOURCE_SERVER_URL: http://localhost:8003/
          LOCATION_SERVER_URL: http://localhost:8006/
          MCP_OPERATOR_URL: http://localhost:8102/mcp

      - name: Tear down
        if: always()
        run: |
          maple down
          docker compose -f docker-compose.ci.yaml down -v
