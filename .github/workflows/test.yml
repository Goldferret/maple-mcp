name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'figures/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'figures/**'
      - 'LICENSE'

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m "not integration" --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      matrix:
        madsci-version: ["v0.5.0", "v0.7.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install matching MADSci client
        run: |
          VERSION=${{ matrix.madsci-version }}
          VERSION=${VERSION#v}
          pip install "madsci.client==${VERSION}" "madsci.common==${VERSION}" "madsci.experiment_application==${VERSION}" "madsci.node_module==${VERSION}"

      - name: Start MADSci services
        run: |
          sed -i "s|ghcr.io/ad-sdl/madsci:v0.5.0|ghcr.io/ad-sdl/madsci:${{ matrix.madsci-version }}|g" docker-compose.ci.yaml
          docker compose -f docker-compose.ci.yaml up -d
          echo "Waiting for services to be ready..."
          sleep 20

      - name: Verify services are up
        run: |
          curl -sf http://localhost:8001/health || curl -sf http://localhost:8001/ || (echo "Event Manager not ready" && exit 1)
          curl -sf http://localhost:8005/health || curl -sf http://localhost:8005/ || (echo "Workcell Manager not ready" && exit 1)
          echo "✓ MADSci ${{ matrix.madsci-version }} services ready"

      - name: Create .env for integration tests
        run: |
          printf 'WORKCELL_SERVER_URL=http://localhost:8005/\nEXPERIMENT_SERVER_URL=http://localhost:8002/\nEVENT_SERVER_URL=http://localhost:8001/\nDATA_SERVER_URL=http://localhost:8004/\nRESOURCE_SERVER_URL=http://localhost:8003/\nLOCATION_SERVER_URL=http://localhost:8006/\nMCP_OPERATOR_URL=http://localhost:8102/mcp\n' > examples/block_sorting/.env
          cp examples/block_sorting/.env .env

      - name: Run integration tests
        run: pytest -m integration --tb=short

      - name: Tear down
        if: always()
        run: |
          maple down || true
          docker compose -f docker-compose.ci.yaml down -v
